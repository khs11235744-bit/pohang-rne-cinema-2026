name: R&E visual briefing privacy regression

on:
  push:
    branches: [main]
    paths:
      - "v2-studio/data/**"
      - "v2-studio/scripts/export-visual-briefs.mjs"
      - "v2-studio/qa/visual-briefs.test.mjs"
      - "v2-studio/package.json"
      - ".github/workflows/visual-briefs.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check v2-studio/scripts/export-visual-briefs.mjs
      - run: node --test v2-studio/qa/visual-briefs.test.mjs

# Never publishes or uploads the output prompts to a third-party model.
